name: Build Windows

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Get dependencies
        run: flutter pub get

      - name: Build Windows release
        run: flutter build windows --release

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: aiba-pos-windows
          path: build/windows/x64/runner/Release/
          retention-days: 30

  build-windows-installer:
    runs-on: windows-latest
    needs: build-windows
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Get dependencies
        run: flutter pub get

      - name: Build Windows release
        run: flutter build windows --release

      # Flutter MSVC runtime'ni O'ZI nusxalamaydi — buni
      # windows/CMakeLists.txt qo'shadi. Agar bir kun ishlamay qolsa,
      # o'rnatuvchi jim chiqaveradi va ilova mijoz kompyuterida
      # ochilmaydi. Shuning uchun bu yerda QAT'IY tekshiriladi.
      - name: Verify VC++ runtime is bundled
        shell: pwsh
        run: |
          $dir = "build/windows/x64/runner/Release"
          $need = @("msvcp140.dll", "vcruntime140.dll", "vcruntime140_1.dll")
          $missing = $need | Where-Object { -not (Test-Path (Join-Path $dir $_)) }
          if ($missing) {
            Write-Host "Release papkadagi fayllar:"
            Get-ChildItem $dir | Select-Object -ExpandProperty Name
            throw "MSVC runtime yetishmaydi: $($missing -join ', ') — toza Windows'da ilova ochilmaydi"
          }
          Write-Host "VC++ runtime joyida: $($need -join ', ')"

      - name: Install Inno Setup
        run: choco install innosetup -y

      # Versiya pubspec'dan olinadi — aks holda «Dasturlar va komponentlar»da
      # har doim 1.0.0 turardi va qaysi build o'rnatilgani bilinmasdi.
      - name: Read version
        shell: bash
        run: echo "VER=$(grep -m1 '^version:' pubspec.yaml | awk '{print $2}' | cut -d+ -f1)" >> "$GITHUB_ENV"

      - name: Build installer
        run: iscc /DAppVersion=${{ env.VER }} windows/installer.iss

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: aiba-pos-installer
          path: windows/Output/
          retention-days: 30

      # macOS bilan bir xil «latest» Release — mijoz bitta sahifadan
      # Windows installer va macOS .dmg ni yuklab oladi (login shart emas).
      - name: Publish installer to "latest" release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: AIBA POS — oxirgi build
          files: windows/Output/*
          prerelease: false
